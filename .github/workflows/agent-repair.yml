# Agent repair loop — Section 5 (the repair loop)
#
# When CI fails on main, this workflow asks Claude Code (headless) to
# diagnose via Frank and open a fix PR. The human stays at the PR gate:
# branch protection on main means an agent can never self-merge.
#
# Required repo secret:
#   ANTHROPIC_API_KEY   — for headless claude -p
#
# Optional (enables diagnosis through Frank instead of gh):
#   FRANK_URL           — e.g. https://frank.internal:8720/mcp (reachable from runner)
#   FRANK_TOKEN         — bearer token for Frank
#
# NOTE FOR RECORDING: verify current claude CLI flags and MCP config format
# against the docs when you record — this surface evolves quickly.

name: Agent repair

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

jobs:
  repair:
    # Only run when CI actually failed (or when triggered manually for the demo)
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project deps
        run: pip install -r requirements.txt

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      # Fail with a clear message rather than letting a downstream tool report
      # an empty secret as a confusing syntax error.
      - name: Check required secrets
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY is not set. Add it under" \
                 "Settings > Secrets and variables > Actions."
            exit 1
          fi

      # Frank is optional. When FRANK_URL/FRANK_TOKEN are set the agent
      # diagnoses through Frank's tools; otherwise it falls back to reading the
      # failed run with gh. Passing an empty URL here is what previously failed
      # the whole job with "Command is required when server name is provided".
      - name: Configure Frank as an MCP server
        id: frank
        env:
          FRANK_URL: ${{ secrets.FRANK_URL }}
          FRANK_TOKEN: ${{ secrets.FRANK_TOKEN }}
        run: |
          if [ -z "$FRANK_URL" ] || [ -z "$FRANK_TOKEN" ]; then
            echo "FRANK_URL/FRANK_TOKEN not set — diagnosing via gh instead."
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          claude mcp add --transport http frank "$FRANK_URL" \
            --header "Authorization: Bearer $FRANK_TOKEN"
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Diagnose and fix
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          FRANK_AVAILABLE: ${{ steps.frank.outputs.available }}
          FAILED_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          if [ "$FRANK_AVAILABLE" = "true" ]; then
            DIAGNOSE="Use Frank's get_failed_jobs and get_job_log tools to find the failing job and root cause."
          elif [ -n "$FAILED_RUN_ID" ]; then
            DIAGNOSE="Run 'gh run view $FAILED_RUN_ID --log-failed' to find the failing step and root cause."
          else
            DIAGNOSE="Find the most recent failed CI run with 'gh run list --workflow=ci.yml --status=failure -L 1', then read it with 'gh run view <id> --log-failed'."
          fi
          claude -p "CI on main is red. ${DIAGNOSE} Create a branch named \
          agent/fix-ci, make the minimal fix, run 'make test' until green, then \
          open a PR with gh pr create explaining the root cause and the fix. Do \
          not touch unrelated code." \
            --allowedTools "mcp__frank__*,Bash(make test),Bash(git checkout:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(gh pr create:*),Bash(gh run view:*),Edit,Read" \
            --max-turns 30

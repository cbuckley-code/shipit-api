# Push-to-deploy: Frank ships himself — Lecture 5.5 area
#
# All an engineer needs: this fork + an Azure account. Nothing local.
# One-time setup (one Cloud Shell command + three repo secrets):
# see infra/azure-setup.md.
#
# First push creates everything (resource group, registry, environment,
# app); every later push just updates the running app. Idempotent.
#
# NOTE FOR RECORDING: az CLI surfaces evolve — dry-run this workflow
# before the session and pin versions if anything drifts.

name: Deploy Frank

on:
  push:
    branches: [main]
    paths:
      - "frank/**"
      - ".github/workflows/deploy-frank.yml"
  workflow_dispatch: {}

env:
  AZURE_RESOURCE_GROUP: shipit-rg
  AZURE_LOCATION: eastus
  APP_NAME: frank

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure (one secret)
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Ensure Container Apps CLI extension
        run: az extension add --name containerapp --upgrade --yes

      - name: Ensure resource group
        run: az group create --name "$AZURE_RESOURCE_GROUP" --location "$AZURE_LOCATION" --output none

      - name: Build and deploy Frank from source
        run: |
          az containerapp up \
            --name "$APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --location "$AZURE_LOCATION" \
            --source ./frank \
            --ingress external \
            --target-port 8720 \
            --env-vars \
              GIT_SHA=${{ github.sha }} \
              DEPLOYED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
              FRANK_GITHUB_REPO=${{ github.repository }}

      - name: Wire secrets into the app (secretrefs, not plaintext)
        run: |
          az containerapp secret set \
            --name "$APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --secrets frank-token="${{ secrets.FRANK_AUTH_TOKEN }}" gh-token="${{ secrets.FRANK_GITHUB_TOKEN }}"
          az containerapp update \
            --name "$APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --set-env-vars \
              FRANK_AUTH_TOKEN=secretref:frank-token \
              FRANK_GITHUB_TOKEN=secretref:gh-token

      - name: Frank is live — print the URL
        run: |
          FQDN=$(az containerapp show \
            --name "$APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn -o tsv)
          {
            echo "## 🟢 Frank is live"
            echo ""
            echo "MCP endpoint: \`https://$FQDN/mcp\`"
            echo ""
            echo "Connect Claude Code:"
            echo '```'
            echo "claude mcp add --transport http frank https://$FQDN/mcp \\"
            echo "  --header \"Authorization: Bearer <your FRANK_AUTH_TOKEN>\""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
